name: Update chart and deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'chart-math.mjs'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/update-and-deploy.yml'
  workflow_dispatch:
  schedule:
    # Every two hours at :17, away from the busiest top-of-hour queue.
    # UTC+8: 00:17, 02:17, ... 22:17. GitHub may delay scheduled runs.
    - cron: '17 */2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify chart math, data normalization and failure handling
        run: node --test scripts/*.test.*

      - name: Fetch latest Artificial Analysis data
        id: refresh
        run: node scripts/fetch_data.cjs

      - name: Commit refreshed data
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current.json
          git diff --cached --quiet || git commit -m "data: refresh intelligence and coding agent charts"
          git push

      - name: Configure GitHub Pages
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
