<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intelligence Index vs. Cost per Intelligence Index Task</title>
  <style>
    :root{color-scheme:light;--ink:#111;--muted:#777;--grid:#e8e8e8;--frame:#666;--green:rgba(144,238,144,.28);--gray:rgba(235,235,235,.42)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
    .wrap{width:100%;height:100vh;min-height:0;padding:18px 22px 24px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}h1{font:500 24px Georgia,serif;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin-bottom:8px}.key,.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:7px 0}.key{gap:16px;color:#555}.sw{width:18px;height:11px;display:inline-block;background:var(--green);border:1px solid #777;margin-right:5px;vertical-align:-1px}.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}.legend span.active{font-weight:700;text-decoration:underline}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:5px 0 7px}.controls button{border:1px solid #bbb;background:#fff;border-radius:5px;padding:4px 9px;cursor:pointer}.controls button:hover{background:#f1f1f1}.label-control{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.label-control input{width:76px;margin:0 2px}.label-control output{min-width:26px;text-align:right;font-variant-numeric:tabular-nums}.chart{width:100%;height:auto;flex:1;min-height:0;overflow:hidden;cursor:grab}.chart.dragging{cursor:grabbing}.chart,.chart svg{user-select:none;outline:none;touch-action:none}svg{width:100%;height:100%;display:block}.axis text{font-family:Inter,system-ui,sans-serif;font-size:10px;fill:#555}.axis line{stroke:var(--frame);stroke-width:1}.grid line{stroke:var(--grid);stroke-width:1}.point{stroke:#fff;stroke-width:1;cursor:pointer}.point:hover{stroke-width:1}.label{font-family:Inter,system-ui,sans-serif;fill:#222;paint-order:stroke;stroke:#fff;stroke-width:2;stroke-linejoin:round;pointer-events:none}.tip{position:fixed;z-index:5;pointer-events:none;display:none;background:#111;color:#fff;border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 5px 16px #0003;max-width:320px}.status{font-size:11px;color:#777;margin-top:3px}.status a{color:inherit}.labels-hidden .label-layer{display:none}.labels-hidden .connector-layer{display:none}@media(max-width:700px){.wrap{padding:14px 10px}.chart{height:auto;flex:1;min-height:0}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>Intelligence Index vs. Cost per Intelligence Index Task</h1>
  <div class="sub">Artificial Analysis Intelligence Index · Weighted average cost (USD) per Intelligence Index task · 横坐标为线性尺度</div>
  <div class="key"><span><i class="sw"></i>Most attractive quadrant</span><span>···· Pareto line</span></div>
  <div id="legend" class="legend"></div>
  <div class="controls">
    <button id="reset">Reset view</button><button id="xminus">X −</button><button id="xplus">X +</button><button id="yminus">Y −</button><button id="yplus">Y +</button><button id="labels">隐藏标签</button>
    <label class="label-control">字号 <input id="labelSize" type="range" min="2.5" max="8" step="0.25" value="4"><output id="labelSizeValue">4</output></label>
    <label class="label-control">距离 <input id="labelDistance" type="range" min="2" max="80" step="1" value="2"><output id="labelDistanceValue">2</output></label>
    <span>滚轮=横向缩放 · Shift+滚轮=纵向缩放 · 拖动绘图区平移</span>
  </div>
  <div id="chart" class="chart"><svg id="svg" preserveAspectRatio="none" viewBox="0 0 1128 384" role="application" aria-label="Intelligence Index versus cost per task"></svg></div>
  <div id="status" class="status">正在加载数据…</div>
</main>
<div id="tip" class="tip"></div>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.querySelector('#svg'),host=document.querySelector('#chart'),tip=document.querySelector('#tip'),statusEl=document.querySelector('#status');
const plot={left:65,right:1123,top:5,bottom:331,xMax:50,yMax:60,xQuadrant:.6,yQuadrant:30};
const originX=plot.left,originY=plot.bottom;let sx=4.7,sy=1,panX=0,panY=0,drag=null,focus=null,company=null,labelFontSize=4,labelDistance=2,items=[],labelMeta=[];
const el=(tag,attrs={})=>{const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n};const text=(value,attrs={})=>{const n=el('text',attrs);n.textContent=value;return n};
const mapX=v=>originX+(v-originX)*sx+panX,mapY=v=>originY+(v-originY)*sy+panY,hex=c=>{const m=(c||'').match(/#(?:[0-9a-f]{3}){1,2}/i);return m?m[0].toLowerCase():(c||'').toLowerCase()};
function bounded(a,b,lo,hi,size){const span=b-a;if(span<=size)return{min:lo-a,max:hi-b};return{min:hi-b,max:lo-a}}function clampPan(){const bx=bounded(originX+(Math.min(...items.map(i=>i.x))-originX)*sx,originX+(Math.max(...items.map(i=>i.x))-originX)*sx,plot.left,plot.right,plot.right-plot.left),by=bounded(originY+(Math.min(...items.map(i=>i.y))-originY)*sy,originY+(Math.max(...items.map(i=>i.y))-originY)*sy,plot.top,plot.bottom,plot.bottom-plot.top);panX=Math.max(bx.min,Math.min(bx.max,panX));panY=Math.max(by.min,Math.min(by.max,panY))}
function setRect(r,x1,y1,x2,y2){const l=Math.max(plot.left,Math.min(plot.right,Math.min(x1,x2))),rr=Math.max(plot.left,Math.min(plot.right,Math.max(x1,x2))),t=Math.max(plot.top,Math.min(plot.bottom,Math.min(y1,y2))),b=Math.max(plot.top,Math.min(plot.bottom,Math.max(y1,y2)));r.setAttribute('x',l);r.setAttribute('y',t);r.setAttribute('width',Math.max(0,rr-l));r.setAttribute('height',Math.max(0,b-t))}
function overlap(a,b){return Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y))}
function makeAxis(){const axis=el('g',{class:'axis'}),grid=el('g',{class:'grid'});for(let v=0;v<=50;v++){const g=el('g',{class:'x-tick'}),line=el('line',{y1:plot.bottom,y2:plot.bottom+4}),lab=text('$'+v,{'text-anchor':'middle'});g.append(line,lab);axis.append(g);grid.append(el('line',{y1:plot.top,y2:plot.bottom}));}for(let v=0;v<=60;v+=10){const g=el('g',{class:'y-tick'}),line=el('line',{x1:plot.left-4,x2:plot.left}),lab=text(String(v),{'text-anchor':'end'});g.append(line,lab);axis.append(g);grid.append(el('line',{x1:plot.left,x2:plot.right}));}axis.append(text('Cost per Task (USD, Linear Scale)',{'class':'x-title','text-anchor':'middle'}),text('Artificial Analysis Intelligence Index',{'class':'y-title','text-anchor':'middle'}));const defs=el('defs'),clip=el('clipPath',{id:'plot-clip'});clip.append(el('rect',{x:plot.left,y:plot.top,width:plot.right-plot.left,height:plot.bottom-plot.top}));defs.append(clip);svg.append(defs,grid,axis);}
function updateAxis(){const axis=svg.querySelector('.axis'),grid=svg.querySelector('.grid');const xt=[...axis.querySelectorAll('.x-tick')],yt=[...axis.querySelectorAll('.y-tick')];xt.forEach((g,i)=>{const x=mapX(plot.left+i/plot.xMax*(plot.right-plot.left));g.querySelector('line').setAttribute('x1',x);g.querySelector('line').setAttribute('x2',x);g.querySelector('text').setAttribute('x',x);g.querySelector('text').setAttribute('y',plot.bottom+15);});yt.forEach((g,i)=>{const y=mapY(plot.bottom-(i*10)/plot.yMax*(plot.bottom-plot.top));g.querySelector('line').setAttribute('y1',y);g.querySelector('line').setAttribute('y2',y);g.querySelector('text').setAttribute('x',plot.left-9);g.querySelector('text').setAttribute('y',y+3);});const xTitle=axis.querySelector('.x-title');xTitle.setAttribute('x',(mapX(plot.left)+mapX(plot.right))/2);xTitle.setAttribute('y',plot.bottom+38);const yTitle=axis.querySelector('.y-title');yTitle.setAttribute('transform',`translate(${plot.left-46} ${(mapY(plot.top)+mapY(plot.bottom))/2}) rotate(-90)`);for(const l of grid.querySelectorAll('line')){if(l.hasAttribute('y1')&&l.hasAttribute('y2')&&l.hasAttribute('x1')&&!l.hasAttribute('x2')){const i=[...grid.querySelectorAll('line')].indexOf(l);l.setAttribute('x1',mapX(plot.left+i/plot.xMax*(plot.right-plot.left)));l.setAttribute('x2',mapX(plot.left+i/plot.xMax*(plot.right-plot.left)));l.setAttribute('y1',mapY(plot.top));l.setAttribute('y2',mapY(plot.bottom))}}const h=[...grid.querySelectorAll('line')].filter(l=>l.hasAttribute('x1')&&l.hasAttribute('x2'));h.forEach((l,i)=>{const y=mapY(plot.bottom-(i*10)/plot.yMax*(plot.bottom-plot.top));l.setAttribute('x1',plot.left);l.setAttribute('x2',plot.right);l.setAttribute('y1',y);l.setAttribute('y2',y)})}
function layoutLabels(){const placed=[],nodeBoxes=items.map(i=>({x:+i.el.getAttribute('cx'),y:+i.el.getAttribute('cy'),it:i})),rect=svg.getBoundingClientRect(),screenYOverX=(rect.height/384)/(rect.width/1128),dirs=Array.from({length:16},(_,i)=>i*Math.PI/8),radii=[2,labelDistance*.45,labelDistance*.7,labelDistance].filter((v,i,a)=>v>=2&&v<=labelDistance&&a.indexOf(v)===i);for(const m of labelMeta.slice().sort((a,b)=>a.item.y-b.item.y)){const n=m.item,x=+n.el.getAttribute('cx'),y=+n.el.getAttribute('cy'),insideNode=x>=plot.left&&x<=plot.right&&y>=plot.top&&y<=plot.bottom;if(!insideNode){m.text.style.visibility='hidden';m.line.style.visibility='hidden';continue}const w=Math.max(10,Math.min(220,n.name.length*labelFontSize*.54+2)),h=labelFontSize*1.25*screenYOverX;let best=null,bestScore=Infinity;for(const radius of radii)for(const angle of dirs){const dx=Math.cos(angle),dy=Math.sin(angle),px=dx>0?x+radius:dx<0?x-radius-w:x-w/2,py=dy>0?y+radius:dy<0?y-radius-h:y-h/2;if(px<plot.left+1||px+w>plot.right-1||py<plot.top+1||py+h>plot.bottom-1)continue;const c={x:px,y:py,w,h,d:radius};let score=c.d*.12;for(const p of placed)score+=overlap(c,p)*3;for(const q of nodeBoxes)if(q.it!==n&&overlap(c,{x:q.x-4,y:q.y-4,w:8,h:8})>0)score+=45;if(score<bestScore){bestScore=score;best=c}}if(!best){m.text.style.visibility='hidden';m.line.style.visibility='hidden';continue}m.text.style.visibility='visible';m.line.style.visibility='visible';placed.push(best);const ex=Math.max(best.x,Math.min(best.x+best.w,x)),ey=Math.max(best.y,Math.min(best.y+best.h,y));m.line.setAttribute('x1',x);m.line.setAttribute('y1',y);m.line.setAttribute('x2',ex);m.line.setAttribute('y2',ey);m.text.setAttribute('x',best.x);m.text.setAttribute('y',best.y);m.text.setAttribute('font-size',labelFontSize)}}
function update(){clampPan();for(const i of items){i.el.setAttribute('cx',mapX(i.x));i.el.setAttribute('cy',mapY(i.y))}const q=svg.querySelectorAll('.quadrant');setRect(q[0],mapX(plot.left),mapY(plot.top),mapX(originX+plot.xQuadrant/plot.xMax*(plot.right-plot.left)),mapY(originY-plot.yQuadrant/plot.yMax*(plot.bottom-plot.top)));setRect(q[1],mapX(originX+plot.xQuadrant/plot.xMax*(plot.right-plot.left)),mapY(originY-plot.yQuadrant/plot.yMax*(plot.bottom-plot.top)),mapX(plot.right),mapY(plot.bottom));const path=svg.querySelector('.pareto');if(path){const d=items.filter(i=>i.cost>0).sort((a,b)=>a.cost-b.cost).reduce((out,i)=>{if(!out.length||i.index>out[out.length-1].index)out.push(i);return out},[]);path.setAttribute('stroke','#666');path.setAttribute('stroke-width','3');path.setAttribute('stroke-dasharray','3 4');path.setAttribute('opacity','1');path.setAttribute('d',d.map((i,n)=>`${n?'L':'M'} ${mapX(i.x)} ${mapY(i.y)}`).join(' '))}updateAxis();layoutLabels()}
function render(data){makeAxis();const content=el('g',{id:'plot-content','clip-path':'url(#plot-clip)'}),quad=el('g',{class:'quadrant-layer','pointer-events':'none'}),q1=el('rect',{class:'quadrant',fill:'#90ee90','fill-opacity':'.28'}),q2=el('rect',{class:'quadrant',fill:'#ebebeb','fill-opacity':'.42'});quad.append(q1,q2);content.append(quad);content.append(el('path',{class:'pareto',fill:'none',stroke:'rgba(0,0,0,.7)','stroke-width':'2.5','stroke-dasharray':'0.1 6','stroke-linecap':'round','pointer-events':'none'}));const connector=el('g',{class:'connector-layer',stroke:'rgba(0,0,0,.24)','stroke-width':'.7','pointer-events':'none'}),label=el('g',{class:'label-layer'}),points=el('g',{class:'points'});content.append(connector,points,label);svg.appendChild(content);const byCompany=new Map();for(const d of data){const x=originX+d.cost/plot.xMax*(plot.right-originX),y=originY-d.intelligenceIndex/plot.yMax*(originY-plot.top),c=hex(d.creator.color);const p=el('circle',{class:'point','data-id':d.id,cx:x,cy:y,r:3,fill:c,'pointer-events':'all'});points.append(p);const line=el('line'),t=text(d.shortName,{class:'label'});connector.append(line);label.append(t);const item={...d,x,y,el:p,name:d.shortName||d.name,color:c,line,text:t};items.push(item);labelMeta.push({item,line,text:t});byCompany.set(d.creator.name,(byCompany.get(d.creator.name)||{name:d.creator.name,color:c,count:0}));byCompany.get(d.creator.name).count++;p.addEventListener('mouseenter',()=>{p.setAttribute('r','6');line.classList.add('connector-highlight');line.setAttribute('stroke-width','2.5');line.setAttribute('stroke',c);t.classList.add('label-highlight');t.setAttribute('fill',c);t.setAttribute('font-size',String(Math.max(7,labelFontSize*1.8)));tip.innerHTML=`<b>${d.name}</b><br>Cost per task: $${d.cost.toFixed(3)}<br>Intelligence Index: ${d.intelligenceIndex.toFixed(1)}<br><small>Click to highlight</small>`;tip.style.display='block'});p.addEventListener('mousemove',e=>{tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px'});p.addEventListener('mouseleave',()=>{p.setAttribute('r','3');line.classList.remove('connector-highlight');line.setAttribute('stroke','rgba(0,0,0,.24)');line.setAttribute('stroke-width','.7');t.classList.remove('label-highlight');t.setAttribute('fill','#222');t.setAttribute('font-size',String(labelFontSize));tip.style.display='none'});p.addEventListener('click',()=>{focus=focus===item?null:item;refresh()})}const legend=document.querySelector('#legend');[...byCompany.values()].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name)).forEach(c=>{const s=document.createElement('span');s.dataset.color=c.color;s.innerHTML=`<i style="background:${c.color}"></i>${c.name}`;s.addEventListener('click',()=>{company=company===c.color?null:c.color;document.querySelectorAll('#legend span').forEach(x=>x.classList.toggle('active',!!company&&x.dataset.color===company));refresh()});legend.append(s)});update()}
function refresh(){for(const i of items){const on=!company||i.color===company;i.el.setAttribute('opacity',on&&(!focus||focus===i)?1:.14)}for(const i of items)i.text.style.opacity=!company||i.color===company?'1':'.12'}
function zoom(axis,f){if(axis==='x')sx=Math.max(.1,Math.min(20,sx*f));else sy=Math.max(.1,Math.min(20,sy*f));update()}function resetView(){sx=4.7;sy=1;panX=panY=0;update()}
host.addEventListener('wheel',e=>{e.preventDefault();const d=Math.max(-240,Math.min(240,e.deltaY));zoom(e.shiftKey?'y':'x',Math.exp(-d*.001))},{passive:false});host.addEventListener('pointerdown',e=>{if(e.target.closest('.axis'))return;e.preventDefault();drag={x:e.clientX,y:e.clientY,panX,panY};host.classList.add('dragging')});host.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();panX=drag.panX+(e.clientX-drag.x)/r.width*1128;panY=drag.panY+(e.clientY-drag.y)/r.height*384;update()});host.addEventListener('pointerup',()=>{drag=null;host.classList.remove('dragging')});host.addEventListener('pointercancel',()=>{drag=null;host.classList.remove('dragging')});svg.addEventListener('dblclick',resetView);document.querySelector('#reset').addEventListener('click',resetView);document.querySelector('#xminus').addEventListener('click',()=>zoom('x',.92));document.querySelector('#xplus').addEventListener('click',()=>zoom('x',1.08));document.querySelector('#yminus').addEventListener('click',()=>zoom('y',.92));document.querySelector('#yplus').addEventListener('click',()=>zoom('y',1.08));document.querySelector('#labels').addEventListener('click',e=>{host.classList.toggle('labels-hidden');e.currentTarget.textContent=host.classList.contains('labels-hidden')?'显示标签':'隐藏标签'});function settings(){labelFontSize=+document.querySelector('#labelSize').value;labelDistance=+document.querySelector('#labelDistance').value;document.querySelector('#labelSizeValue').textContent=labelFontSize;document.querySelector('#labelDistanceValue').textContent=labelDistance;update()}document.querySelector('#labelSize').addEventListener('input',settings);document.querySelector('#labelDistance').addEventListener('input',settings);
fetch('data/current.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{render(d.models);statusEl.innerHTML=`数据来源：<a href="${d.sourceUrl}" target="_blank" rel="noopener">${d.source}</a> · 数据更新时间：${new Date(d.updatedAt).toLocaleString()} · ${d.modelCount} 个模型`}).catch(e=>{statusEl.textContent='数据加载失败：'+e.message;console.error(e)});
</script>
</body>
</html>
