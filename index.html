host.addEventListener('wheel',e=>{e.preventDefault();const d=Math.max(-240,Math.min(240,e.deltaY));zoom(e.shiftKey?'y':'x',Math.exp(-d*.001))},{passive:false});host.addEventListener('pointerdown',e=>{if(e.target.closest('.axis'))return;e.preventDefault();drag={x:e.clientX,y:e.clientY,panX,panY};host.classList.add('dragging')});host.addEventListener('pointermove',e=>{if(activeHover&&e.target!==activeHover.p)clearHover();if(!drag)return;const r=svg.getBoundingClientRect();panX=drag.panX+(e.clientX-drag.x)/r.width*1128;panY=drag.panY+(e.clientY-drag.y)/r.height*384;update()});host.addEventListener('pointerup',()=>{drag=null;host.classList.remove('dragging')});host.addEventListener('pointercancel',()=>{drag=null;host.classList.remove('dragging')});svg.addEventListener('dblclick',resetView);document.querySelector('#reset').addEventListener('click',resetView);document.querySelector('#xminus').addEventListener('click',()=>zoom('x',.92));document.querySelector('#xplus').addEventListener('click',()=>zoom('x',1.08));document.querySelector('#yminus').addEventListener('click',()=>zoom('y',.92));document.querySelector('#yplus').addEventListener('click',()=>zoom('y',1.08));document.querySelector('#labels').addEventListener('click',e=>{host.classList.toggle('labels-hidden');e.currentTarget.textContent=host.classList.contains('labels-hidden')?'显示标签':'隐藏标签'});function settings(){labelFontSize=+document.querySelector('#labelSize').value;labelDistance=+document.querySelector('#labelDistance').value;document.querySelector('#labelSizeValue').textContent=labelFontSize;document.querySelector('#labelDistanceValue').textContent=labelDistance;update()}document.querySelector('#labelSize').addEventListener('input',settings);document.querySelector('#labelDistance').addEventListener('input',settings);
fetch('data/current.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{render(d.models);statusEl.innerHTML=`数据来源：<a href="${d.sourceUrl}" target="_blank" rel="noopener">${d.source}</a> · 数据更新时间：${new Date(d.updatedAt).toLocaleString()} · ${d.modelCount} 个模型`}).catch(e=>{statusEl.textContent='数据加载失败：'+e.message;console.error(e)});
new ResizeObserver(()=>{if(items.length)layoutLabels()}).observe(host);
</script>
</body>
